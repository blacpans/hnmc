name: Sync Hacker News to microCMS

on:
  schedule:
    # 毎日朝 8:00 (JST) に実行（UTC では前日の 23:00）
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHub Actions 画面から手動実行できるようにする

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: PROD
    defaults:
      run:
        working-directory: batch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'batch/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run sync batch
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
        run: npm start
