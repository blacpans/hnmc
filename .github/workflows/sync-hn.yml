name: Sync Hacker News to microCMS

on:
  # 定時実行は Cloudflare Workers Cron Triggers (worker/) 側から workflow_dispatch で起動する
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: PROD
    defaults:
      run:
        working-directory: batch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'batch/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run sync batch
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
        run: npm start
